[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contractflow-research"
version = "0.1.0"
description = "Research code for verifiable contract-guided long-form generation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anonymous Authors" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["learnbyai_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
